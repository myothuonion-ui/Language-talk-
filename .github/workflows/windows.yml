name: Windows Desktop
on:
  push:
    branches: [main]
    paths:
      [
        "desktop/**",
        ".github/workflows/windows.yml",
        "app/src/main/assets/**",
        "docs/WINDOWS.md",
      ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Verify persistence, backup, source grounding and API request contracts
        run: npm test
      - name: Exercise desktop PDF, notes, practice, recording and replay controls
        run: npm run test:ui
      - name: Build Windows installer and portable executable
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Exercise the packaged Windows app
        run: npm run test:ui
        env:
          LANGUAGE_TALK_EXECUTABLE: dist/win-unpacked/Language Talk.exe
      - name: Verify executable version and produce checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/*.exe
          if ($files.Count -ne 2) { throw "Expected installer and portable EXE" }
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content dist/SHA256SUMS-Windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-validation
          path: desktop/test-output/
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS-Windows.txt
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: windows-v0.2.1
          name: Language Talk for Windows v0.2.1 · Reading First
          prerelease: true
          make_latest: false
          body: |
            Reading First brings the original PDF up under a thin reader bar, replacing the three stacked reader headers.

            - Controls opens an overlay toolbar without reducing the PDF reading area
            - Close controls with the close button, Escape or a click outside
            - Full book title, bookshelf, chapters, page bookmarks, page input, Fit width/page, zoom, Text mode and reader themes in the overlay
            - Page shortcuts, previous/next, Focus and AI toggle stay available in the thin bar
            - App status and API settings remain available in Me
            - Existing source annotations, Track playback, character practice, paired recordings and Replays are included
            - App name and local data remain compatible with the previous Windows release

            Windows 10/11 x64. Use Setup to install or Portable to run without installation.
            API-backed features require your own Gemini/NVIDIA key and internet.
            NVIDIA's hosted text endpoint does not provide speech, transcription or native Live.
            Desktop data does not automatically sync with Android. Android backup import is not supported yet.
            This is an unsigned preview; Windows may show an unknown-publisher notice.
            Checks: Node persistence/provider/dialogue tests and Electron UI checks on both source and packaged Windows builds.
            AI responses in UI checks use test fixtures; real availability depends on your provider key and quota.
            Physical microphone/echo behavior and live provider availability require testing on your device.
            Guide: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/WINDOWS.md
          files: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS-Windows.txt
