name: Windows Desktop
on:
  push:
    branches: [main]
    paths:
      [
        "desktop/**",
        ".github/workflows/windows.yml",
        "app/src/main/assets/**",
        "docs/WINDOWS.md",
      ]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - name: Verify persistence, backup, source grounding and API request contracts
        run: npm test
      - name: Exercise desktop PDF, notes, practice, recording and replay controls
        run: npm run test:ui
      - name: Build Windows installer and portable executable
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Exercise the packaged Windows app
        run: npm run test:ui
        env:
          LANGUAGE_TALK_EXECUTABLE: dist/win-unpacked/Language Talk.exe
      - name: Verify executable version and produce checksums
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/*.exe
          if ($files.Count -ne 2) { throw "Expected installer and portable EXE" }
          $lines = $files | ForEach-Object { "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)" }
          $lines | Set-Content dist/SHA256SUMS-Windows.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-desktop-validation
          path: desktop/test-output/
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS-Windows.txt
      - uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: windows-v0.2.0
          name: Language Talk for Windows v0.2.0 · Study Desk
          prerelease: true
          make_latest: false
          body: |
            Study Desk update for Language Talk. The app name and existing local data are preserved.

            - Original PDF pages with a compact navigation rail and optional companion panel
            - Focus, Fit width / Fit page, whole-page zoom and separate main Text mode
            - Native API key Paste buttons, Ctrl+V, and right-click editing menu
            - Source-position highlights and underlines; bold in Text mode; page bookmarks and notebook links
            - Printed PDF Track hotspots and persistent audio by book and Track number
            - Choose your book character; AI plays the other characters; exact or free conversation
            - Explicit Next, optional microphone, stop to read, Myanmar feedback
            - Original user and AI audio paired in Replays with speaker filters, speed and A–B repeat
            - New PDFs supported; manual character mapping when dialogue cannot be detected
            - Both bundled Korean books, daily practice, native Gemini Live and encrypted per-user keys

            Windows 10/11 x64. Use Setup to install or Portable to run without installation.
            API-backed features require your own Gemini/NVIDIA key and internet.
            NVIDIA's hosted text endpoint does not provide speech, transcription or native Live.
            Desktop data does not automatically sync with Android. Android backup import is not supported yet.
            This is an unsigned preview; Windows may show an unknown-publisher notice.
            Checks: Node persistence/provider/dialogue tests and Electron UI checks on both source and packaged Windows builds.
            AI responses in UI checks use test fixtures; real availability depends on your provider key and quota.
            Physical microphone/echo behavior and live provider availability require testing on your device.
            Guide: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/WINDOWS.md
          files: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS-Windows.txt
