name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --gradle-distribution-url https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip
      - name: Check legacy backup conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Restore development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: language-talk-dev-signing-${{ github.ref_name }}-v1
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.9.0.apk
          sha256sum language-talk-v0.9.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.9.0-apk
          path: |
            language-talk-v0.9.0.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/provider-contract
            app/build/reports/lint-results-debug.html

  device-tests:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2 --gradle-distribution-url https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots

  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backup helper
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch official Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath bundled-tools
      - name: Package Windows backup helper
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --onefile --windowed --name language-talk-legacy-backup-windows --add-data "bundled-tools/platform-tools;platform-tools" tools/backup_legacy_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
          path: dist/language-talk-legacy-backup-windows.exe
          if-no-files-found: error

  publish:
    needs: [build, device-tests, windows-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.9.0-apk
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          name: Language Talk AI v0.9.0
          body: |
            Language Talk 0.9.0 — Reader and deliberate practice update.

            - Horizontal swipe and continuous vertical PDF reading
            - Persistent highlight, underline, Text-mode bold, notes and saved passages
            - Searchable saved collection and source-page navigation
            - Cached whole-page Myanmar teaching cards with source anchors, grammar and hidden answers
            - Korean AI speech and user-imported original Track audio
            - Correct attempts wait for the learner's Next button; free chapter/section selection restores unfinished work
            - Actual book microphone capture level, recording timer and provider transcript
            - Persisted System / Light / Dark appearance and extended backup/restore

            Development update. Existing API keys remain local; new explanations and uncached speech require a configured account.
            Real provider/microphone checks require your device; automated CI does not use personal API keys.
            BACK UP before installation: Me → My Context → Export backup. Earlier releases used changing debug signing keys;
            Android may require reinstalling. Restore your JSON and re-enter API keys afterward. Keep imported PDF/audio originals.
            Guide: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/READER_PRACTICE_0_9.md
          files: |
            language-talk-v0.9.0.apk
            SHA256SUMS.txt
            language-talk-legacy-backup-windows.exe
          prerelease: true
          make_latest: false
