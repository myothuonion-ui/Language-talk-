name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.5.0-apk
          path: language-talk-v0.5.0.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Collect screen captures
        if: always()
        run: adb pull /sdcard/Android/data/com.myothuonion.languagetalk/files/screenshots ui-screenshots || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots

  publish:
    needs: [build, device-tests]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.5.0-apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Language Talk AI v0.5.0
          body: |
            Personal Korean voice practice and learning memory.

            - Guided Practice, Roleplay, and Free Talk
            - Repeat a phrase, then use it independently before moving on
            - Persistent lesson steps, learning notes, and spaced review
            - Saved custom voice presets, Slow/Natural pace, configurable answer pauses
            - Native Live voice configuration, interruption, and session resumption
            - Selected NVIDIA brain modes use Gemini TTS hands-free conversation
            - Voice recordings, replay, and deletion
            - Editable personal profile, global/chat memories, and learning notes
            - Portable backup/restore including recordings; API keys excluded
            - Home, Practice, Review, My Context, and Settings
            - Preserves v0.4.0 chats through a database migration
            - Unit tests, lint, APK build, migration/restore tests, and emulator screen checks

            Install the APK below. Live provider calls require your own API keys.
          files: language-talk-v0.5.0.apk
          make_latest: true
