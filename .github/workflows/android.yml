name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2 --gradle-distribution-url https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip
      - name: Check legacy backup conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Restore development signing identity
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: language-talk-dev-signing-main-v1
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.10.0.apk
          sha256sum language-talk-v0.10.0.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.10.0-apk
          path: |
            language-talk-v0.10.0.apk
            SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/provider-contract
            app/build/reports/lint-results-debug.html

  device-tests:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2 --gradle-distribution-url https://downloads.gradle.org/distributions/gradle-8.10.2-bin.zip
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots
            ui-instrumentation.log

  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backup helper
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch official Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath bundled-tools
      - name: Package Windows backup helper
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --onefile --windowed --name language-talk-legacy-backup-windows --add-data "bundled-tools/platform-tools;platform-tools" tools/backup_legacy_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
          path: dist/language-talk-legacy-backup-windows.exe
          if-no-files-found: error

  publish:
    needs: [build, device-tests, windows-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.10.0-apk
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.10.0
          name: Language Talk AI v0.10.0
          body: |
            Language Talk 0.10.0 — Balanced reader, paired recordings and API repair.

            - Books / Practice / Replays / Me navigation; new Book & Voice icon; app identity unchanged
            - Feature-specific real API probes for text, page JSON, speech, transcription and native Live
            - Dedicated source-grounded PDF JSON, cached partial results and resume of missing sections
            - Original imported audio opens by printed Track number; batch Track-file import and manual page links
            - Durable user and AI audio, speaker filters, transcript seeking, speed controls and A–B loops
            - Source-linked word/grammar notebook, page questions and listen–repeat–compare
            - Database migration and additive backup restoration; per-session ZIP export

            Real account checks on 13 October 2026: Gemini PDF-image reading, speech generation,
            generated-sample transcription and native Live audio; NVIDIA structured text.
            Provider congestion can still cause timeouts. Tests use supplied credentials temporarily;
            no personal keys are included in source, CI or APK. Enter your own keys in Me → Settings → AI & APIs.
            Back up before upgrading. Original imported PDFs/tracks must be retained separately.
            Physical microphone/echo behavior still depends on your device.
            Guide: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/BALANCED_0_10.md
          files: |
            language-talk-v0.10.0.apk
            SHA256SUMS.txt
            language-talk-legacy-backup-windows.exe
          prerelease: true
          make_latest: false
