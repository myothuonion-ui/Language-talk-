name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Check legacy backup conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.5.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.5.0-apk
          path: language-talk-v0.5.0.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/lint-results-debug.html

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots

  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backup helper
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch official Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath bundled-tools
      - name: Package Windows backup helper
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --onefile --windowed --name language-talk-legacy-backup-windows --add-data "bundled-tools/platform-tools;platform-tools" tools/backup_legacy_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
          path: dist/language-talk-legacy-backup-windows.exe
          if-no-files-found: error

  publish:
    needs: [build, device-tests, windows-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.5.0-apk
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.0
          name: Language Talk AI v0.5.0
          body: |
            Personal Korean voice practice and learning memory.

            - Guided Practice, Roleplay, and Free Talk
            - Repeat a phrase, then use it independently before moving on
            - Persistent lesson steps, learning notes, and spaced review
            - Saved custom voice presets, Slow/Natural pace, configurable answer pauses
            - Native Live voice configuration, interruption, and session resumption
            - Selected NVIDIA brain modes use Gemini TTS hands-free conversation
            - Voice recordings, replay, and deletion
            - Editable personal profile, global/chat memories, and learning notes
            - Portable backup/restore including recordings; API keys excluded
            - Home, Practice, Review, My Context, and Settings
            - Database migration and a Windows helper to save v0.4.0 chats before reinstalling
            - Unit tests, lint, APK build, migration/restore tests, and emulator screen checks

            IMPORTANT: v0.4.0 and this APK have different signing certificates. Save your old chats before uninstalling. The Windows backup helper below does not delete phone data.
            Upgrade instructions: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/UPGRADING.md

            Install the APK below. Live provider calls require your own API keys and microphone testing on your device.
          files: |
            language-talk-v0.5.0.apk
            language-talk-legacy-backup-windows.exe
          make_latest: true
