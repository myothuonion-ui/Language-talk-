name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: language-talk-beta-debug-signing-v1
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Check legacy backup conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.9.0.apk
          sha256sum language-talk-v0.9.0.apk > language-talk-v0.9.0.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.9.0-apk
          path: |
            language-talk-v0.9.0.apk
            language-talk-v0.9.0.apk.sha256
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/provider-contract
            app/build/reports/lint-results-debug.html

  device-tests:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots

  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backup helper
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch official Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath bundled-tools
      - name: Package Windows backup helper
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --onefile --windowed --name language-talk-legacy-backup-windows --add-data "bundled-tools/platform-tools;platform-tools" tools/backup_legacy_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
          path: dist/language-talk-legacy-backup-windows.exe
          if-no-files-found: error

  publish:
    needs: [build, device-tests, windows-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.9.0-apk
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.9.0
          name: Language Talk AI v0.9.0
          prerelease: true
          body: |
            Language Talk v0.9.0 — Reader and speaking practice update.

            - Swipe PDF pages; select words and save highlights, underlines, bold text-mode emphasis, passages and notes
            - Search the entire book, view page thumbnails, save page images and open saved source references
            - Explain a whole page in structured Myanmar teaching cards, with vocabulary, separate grammar rules and hidden exercise answers
            - Korean speaker actions beside textbook lines and teaching examples; import matching original track audio
            - Redesigned Book and Live practice with real microphone levels, recording time and recognized text
            - Explicit Continue after a successful attempt; choose any chapter/section while preserving unfinished progress
            - Saved reader collections and practice directly from a selected or saved passage
            - System / Light / Dark appearance and consistent glass icons
            - Room v4→v5 migration and extended backup/restore for reader notes and waiting practice states

            This is a beta update. Automated tests do not verify your provider quota, account model access,
            real phone microphone acoustics, or the quality of every AI-generated Myanmar explanation.
            Add your own keys in Me → Settings → AI & APIs.
            Back up in Me → My Context before installing. Older APK signing keys can require reinstalling;
            backups exclude original imported PDF/audio files and API keys. Keep those original files.
            Original track files are user imports; generated speech is labelled AI voice.
            SHA-256 is provided alongside the APK.
          files: |
            language-talk-v0.9.0.apk
            language-talk-v0.9.0.apk.sha256
            language-talk-legacy-backup-windows.exe
          make_latest: false
