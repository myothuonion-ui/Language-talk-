name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Check legacy backup conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.5.2.apk
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.5.2-apk
          path: language-talk-v0.5.2.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/provider-contract
            app/build/reports/lint-results-debug.html

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots

  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backup helper
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch official Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath bundled-tools
      - name: Package Windows backup helper
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --onefile --windowed --name language-talk-legacy-backup-windows --add-data "bundled-tools/platform-tools;platform-tools" tools/backup_legacy_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
          path: dist/language-talk-legacy-backup-windows.exe
          if-no-files-found: error

  publish:
    needs: [build, device-tests, windows-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.5.2-apk
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.5.2
          name: Language Talk AI v0.5.2
          body: |
            Fixes "Audio delivery mode is not supported" during Gemini voice chat.

            - Removes the explicitly selected audio delivery mode rejected by Gemini TTS
            - Keeps exact spoken text, custom voice/style metadata and WAV output
            - Makes the Live retry control accessible on shorter screens
            - Stops microphone capture after voice/playback errors and prevents stale session starts
            - Tests actual app request fixtures, real Gemini WAV playback, invalid audio and the retry screen

            Actual provider checks performed outside public CI with a user-supplied key: the old request reproduced HTTP 400; corrected speech returned WAV; structured tutoring succeeded through the configured text fallback; native Live setup, lesson tool, audio input transcription and spoken reply succeeded over two turns. Personal keys are not included in this APK, repository or CI.

            BACK UP FIRST: this debug APK uses a different runner-generated signing key. In your old app, use My Context → Export backup before uninstalling. Install this APK, restore the JSON and re-enter your key. For v0.4.0 use the Windows helper below.
            Upgrade instructions: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/UPGRADING.md

            Your phone microphone/network and current provider quota still affect live use. Settings → Test checks text and speech access; native Live is checked at session start.
          files: |
            language-talk-v0.5.2.apk
            language-talk-legacy-backup-windows.exe
          make_latest: true
