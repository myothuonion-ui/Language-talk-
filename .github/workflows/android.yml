name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Check legacy backup conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.8.1.apk
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.8.1-apk
          path: language-talk-v0.8.1.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/provider-contract
            app/build/reports/lint-results-debug.html

  device-tests:
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots-${{ matrix.api }}
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots

  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backup helper
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch official Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath bundled-tools
      - name: Package Windows backup helper
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --onefile --windowed --name language-talk-legacy-backup-windows --add-data "bundled-tools/platform-tools;platform-tools" tools/backup_legacy_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
          path: dist/language-talk-legacy-backup-windows.exe
          if-no-files-found: error

  publish:
    needs: [build, device-tests, windows-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.8.1-apk
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.8.1
          name: Language Talk AI v0.8.1
          body: |
            Language Talk v0.8.1: clearer Korean practice and flexible AI connections.

            - Practice opens with Book lessons, Live conversation, and a small daily lesson
            - Daily lessons teach the pattern, Myanmar meaning and vocabulary before practice
            - Korean speech only; Myanmar grammar and corrections stay as text
            - Guided answer frames, optional full examples, Open conversation and help on demand
            - Gemini / NVIDIA / OpenAI / Claude / DeepSeek and custom API profiles
            - Per-feature or per-chat model choices, ordered fallbacks, independent two-AI review
            - Native Gemini Live plus hands-free transcription → chosen text AI → Korean speech
            - Gemini and NVIDIA fallback defaults; paid API fallback requires enabling it
            - Existing books, PDF reader, My Context and learning data preserved

            Add your own keys in Me → Settings → AI & APIs. Keys are encrypted locally and excluded from backups.
            Text/API routing is covered by automated HTTP tests; account quotas, model access and language quality depend on your provider. Use Test text after adding a key.
            Native Live currently uses Gemini. OpenAI supports the voice pipeline through file transcription and speech APIs; NVIDIA, Claude and DeepSeek are text brains.
            Back up in Me → My Context → Export before installing if Android requests uninstall because of the earlier APK signing key. Restore JSON and re-enter keys afterward. Keep imported source PDFs.
            Guide: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/AI_AND_PRACTICE.md
          files: |
            language-talk-v0.8.1.apk
            language-talk-legacy-backup-windows.exe
          make_latest: true
