name: Build Android APK

on:
  push:
    branches: [main, 'codex/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.10.2
      - name: Check legacy backup conversion
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Unit tests, lint, APK, and device-test compilation
        run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleDebugAndroidTest --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk language-talk-v0.6.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-v0.6.0-apk
          path: language-talk-v0.6.0.apk
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-test-reports
          path: |
            app/build/reports/tests
            app/build/reports/provider-contract
            app/build/reports/lint-results-debug.html

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - run: gradle wrapper --gradle-version 8.10.2
      - name: Enable KVM
        run: sudo chmod 666 /dev/kvm
      - name: Test upgrade, restore, and screens on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash tools/run-device-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-tests-and-screenshots
          path: |
            app/build/reports/androidTests
            app/build/outputs/androidTest-results
            ui-screenshots

  windows-backup:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test backup helper
        run: python -m unittest discover -s tools -p 'test_*.py' -v
      - name: Fetch official Android Platform Tools
        shell: pwsh
        run: |
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile platform-tools.zip
          Expand-Archive platform-tools.zip -DestinationPath bundled-tools
      - name: Package Windows backup helper
        run: |
          python -m pip install pyinstaller==6.16.0
          python -m PyInstaller --onefile --windowed --name language-talk-legacy-backup-windows --add-data "bundled-tools/platform-tools;platform-tools" tools/backup_legacy_context.py
      - uses: actions/upload-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
          path: dist/language-talk-legacy-backup-windows.exe
          if-no-files-found: error

  publish:
    needs: [build, device-tests, windows-backup]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-v0.6.0-apk
      - uses: actions/download-artifact@v4
        with:
          name: language-talk-legacy-backup-windows
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.6.0
          name: Language Talk AI v0.6.0
          body: |
            Built-in TTMIK Real-Life Korean Conversations: Beginner (40 chapters) and Intermediate (30 chapters).

            - Both original user-supplied PDFs and all 70 page-linked chapters are included
            - Exact dialogue turns, selectable roles, multiple characters and formal/casual scenes
            - Original vocabulary, cultural tips, grammar, pronunciation and 507 exercises/answers
            - Myanmar explanations generated with your configured Gemini key and cached locally
            - Hands-free book practice, typed answers, Slow/Natural pace and existing custom voice settings
            - Saved course/section/turn, corrections and review mistakes, included in portable backup
            - Offline original-book reading with a page viewer; Korean Only review hides answers
            - Extra personal application practice after a chapter, using its original grammar

            BACK UP FIRST: in your current app, My Context → Export backup before uninstalling. CI debug APKs use runner-generated signing keys; if Android rejects the update, install after backing up and uninstalling, restore your JSON and re-enter your API key.

            Books and exact typed answers work offline. New Myanmar explanations and voice need your key/network. No personal provider keys are included in the APK, repository or CI.
            Guide: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/BOOK_COURSES.md
            Upgrade: https://github.com/myothuonion-ui/Language-talk-/blob/main/docs/UPGRADING.md
          files: |
            language-talk-v0.6.0.apk
            language-talk-legacy-backup-windows.exe
          make_latest: true
